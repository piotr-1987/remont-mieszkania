<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Wydatki Mieszkanie 56 - Sielskie Podolany</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f7f7f7; }
    h1 { color: #333; }
    .filters, .form-container { margin-bottom: 20px; padding: 10px; background: #fff; border-radius: 8px; }
    table { border-collapse: collapse; width: 100%; background: #fff; margin-bottom: 10px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
    button { padding: 6px 12px; margin: 2px; cursor: pointer; }
    .charts { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
    .chart-box { flex: 1 1 45%; background: #fff; padding: 10px; border-radius: 8px; height: 300px; }
    .summary { font-weight: bold; font-size: 1.1em; margin-top: 10px; }
  </style>
</head>
<body>

<h1>💰 Wydatki - Mieszkanie 56</h1>
<img src="https://jakon-inwest.pl/upload/pictures/budynekb.jpg" alt="Nagłówek" style="max-width:100%; border-radius:10px; margin-bottom:20px;">

<div class="form-container">
  <h3>Dodaj / Edytuj wydatek</h3>
  <form id="expenseForm">
    <input type="hidden" id="rowNum">
    Data: <input type="date" id="data" required>
    Typ: <input type="text" id="typ" required>
    Nazwa: <input type="text" id="nazwa">
    Model: <input type="text" id="model">
    Pomieszczenie: <input type="text" id="pomieszczenie">
    Kategoria: <input type="text" id="kategoria">
    Kwota: <input type="number" id="kwota" step="0.01" required>
    Dokument: <input type="text" id="dokument">
    Dodający: <input type="text" id="dodajacy">
    Kto płaci: <input type="text" id="kto_placi">
    <button type="submit">💾 Zapisz</button>
  </form>
</div>

<div class="filters">
  <h3>Filtry</h3>
  Kategoria: <input type="text" id="filterKategoria">
  Pomieszczenie: <input type="text" id="filterPomieszczenie">
  Nazwa: <input type="text" id="filterNazwa">
  Model: <input type="text" id="filterModel">
  <button onclick="applyFilters()">🔍 Filtruj</button>
  <button onclick="resetFilters()">♻️ Reset</button>
</div>

<table id="expensesTable">
  <thead>
    <tr>
      <th>Data</th><th>Typ</th><th>Nazwa</th><th>Model</th>
      <th>Pomieszczenie</th><th>Kategoria</th><th>Kwota</th>
      <th>Dokument</th><th>Dodający</th><th>Kto płaci</th><th>Akcje</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<div class="summary" id="summaryText">Do tej pory wydano: 0 zł</div>
<button onclick="downloadPDF()">📄 Pobierz PDF</button>

<div class="charts">
  <div class="chart-box"><canvas id="categoryChart"></canvas></div>
  <div class="chart-box"><canvas id="timeChart"></canvas></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhGpq5_IG6muSAtaTA24fvBBXgt-ORjJfexOSop9cbwYLbN39XG0HojHBsT_gQBw4WVg/exec";
let expensesData = [];
let categoryChart, timeChart;

async function fetchExpenses() {
  try {
    const res = await fetch(SCRIPT_URL);
    expensesData = await res.json();
    renderTable(expensesData);
    updateCharts(expensesData);
    updateSummary(expensesData);
  } catch(e) { console.error("Błąd fetch:", e); }
}

function renderTable(data) {
  const tbody = document.querySelector("#expensesTable tbody");
  tbody.innerHTML = "";
  data.forEach((exp, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${exp.data}</td>
      <td>${exp.typ}</td>
      <td>${exp.nazwa}</td>
      <td>${exp.model}</td>
      <td>${exp.pomieszczenie}</td>
      <td>${exp.kategoria}</td>
      <td>${exp.kwota}</td>
      <td>${exp.dokument}</td>
      <td>${exp.dodajacy}</td>
      <td>${exp.kto_placi}</td>
      <td>
        <button onclick="editExpense(${i})">✏️</button>
        <button onclick="deleteExpense(${i})">🗑️</button>
      </td>`;
    tbody.appendChild(tr);
  });
}

document.getElementById("expenseForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const rowNum = document.getElementById("rowNum").value;
  const expense = {
    action: rowNum ? "updateData" : "addData",
    rowNum,
    data: document.getElementById("data").value,
    typ: document.getElementById("typ").value,
    nazwa: document.getElementById("nazwa").value,
    model: document.getElementById("model").value,
    pomieszczenie: document.getElementById("pomieszczenie").value,
    kategoria: document.getElementById("kategoria").value,
    kwota: parseFloat(document.getElementById("kwota").value),
    dokument: document.getElementById("dokument").value,
    dodajacy: document.getElementById("dodajacy").value,
    kto_placi: document.getElementById("kto_placi").value
  };
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(expense)
    });
    document.getElementById("expenseForm").reset();
    document.getElementById("rowNum").value = "";
    fetchExpenses();
  } catch(e) { console.error("Błąd zapisu:", e); }
});

async function deleteExpense(index) {
  const exp = expensesData[index];
  if(!confirm("Na pewno usunąć ten wydatek?")) return;
  const payload = { action: "deleteData", rowNum: exp._rowNum || index };
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    fetchExpenses();
  } catch(e) { console.error("Błąd usuwania:", e); }
}

function editExpense(index) {
  const exp = expensesData[index];
  document.getElementById("rowNum").value = exp._rowNum || index;
  document.getElementById("data").value = exp.data;
  document.getElementById("typ").value = exp.typ;
  document.getElementById("nazwa").value = exp.nazwa;
  document.getElementById("model").value = exp.model;
  document.getElementById("pomieszczenie").value = exp.pomieszczenie;
  document.getElementById("kategoria").value = exp.kategoria;
  document.getElementById("kwota").value = exp.kwota;
  document.getElementById("dokument").value = exp.dokument;
  document.getElementById("dodajacy").value = exp.dodajacy;
  document.getElementById("kto_placi").value = exp.kto_placi;
}

function applyFilters() {
  const k = document.getElementById("filterKategoria").value.toLowerCase();
  const p = document.getElementById("filterPomieszczenie").value.toLowerCase();
  const n = document.getElementById("filterNazwa").value.toLowerCase();
  const m = document.getElementById("filterModel").value.toLowerCase();

  const filtered = expensesData.filter(exp =>
    (k ? exp.kategoria.toLowerCase().includes(k) : true) &&
    (p ? exp.pomieszczenie.toLowerCase().includes(p) : true) &&
    (n ? exp.nazwa.toLowerCase().includes(n) : true) &&
    (m ? exp.model.toLowerCase().includes(m) : true)
  );

  renderTable(filtered);
  updateCharts(filtered);
  updateSummary(filtered);
}

function resetFilters() {
  document.getElementById("filterKategoria").value = "";
  document.getElementById("filterPomieszczenie").value = "";
  document.getElementById("filterNazwa").value = "";
  document.getElementById("filterModel").value = "";
  renderTable(expensesData);
  updateCharts(expensesData);
  updateSummary(expensesData);
}

function updateSummary(data) {
  const sum = data.reduce((acc, e) => acc + parseFloat(e.kwota || 0), 0);
  document.getElementById("summaryText").textContent = `Do tej pory wydano: ${sum.toFixed(2)} zł`;
}

function updateCharts(data) {
  // Dane wg kategorii
  const categories = {};
  data.forEach(e => {
    categories[e.kategoria] = (categories[e.kategoria] || 0) + parseFloat(e.kwota || 0);
  });
  const catLabels = Object.keys(categories);
  const catValues = Object.values(categories);

  if(categoryChart) categoryChart.destroy();
  const ctx1 = document.getElementById("categoryChart").getContext("2d");
  categoryChart = new Chart(ctx1, {
    type: "pie",
    data: { labels: catLabels, datasets: [{ data: catValues, backgroundColor: catLabels.map(() => '#'+Math.floor(Math.random()*16777215).toString(16)) }] }
  });

  // Dane wg czasu (daty)
  const timeMap = {};
  data.forEach(e => { timeMap[e.data] = (timeMap[e.data] || 0) + parseFloat(e.kwota || 0); });
  const timeLabels = Object.keys(timeMap).sort();
  const timeValues = timeLabels.map(l => timeMap[l]);

  if(timeChart) timeChart.destroy();
  const ctx2 = document.getElementById("timeChart").getContext("2d");
  timeChart = new Chart(ctx2, {
    type: "bar",
    data: { labels: timeLabels, datasets: [{ label: "Kwota", data: timeValues, backgroundColor: '#4e73df' }] },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

function downloadPDF() {
  const element = document.body;
  html2pdf().set({ margin: 0.5, filename: 'wydatki_mieszkanie56.pdf', html2canvas: { scale: 2 } }).from(element).save();
}

// inicjalizacja
fetchExpenses();
